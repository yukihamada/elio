name: Test

on:
  push:
    branches: [master, develop, main]
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload verified builds to ASC (never submit for review)'
        type: boolean
        default: false
      build_number:
        description: 'New CFBundleVersion for upload'
        type: string
        default: '58'
      platforms:
        description: 'Platforms to upload (both, ios, mac)'
        type: choice
        options: [both, ios, mac]
        default: both
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Test model download recovery with local fixtures
        run: python3 scripts/test-model-download.py

      - name: Prepare Catalyst-compatible MarkdownView
        run: python3 scripts/prepare-markdown.py

      - name: Fetch llama.xcframework (CI-only build dependency)
        run: |
          # Frameworks/llama.xcframework is .gitignore'd (it's normally a symlink to a
          # local build of the local-multi-agent/LocalLLMClient repo). CI has no such
          # repo checked out, so Packages/llama-local's binaryTarget can't resolve
          # without it. Pull the pinned copy from the CI-only release instead of
          # building llama.cpp from source on every run.
          curl --fail --silent --show-error --location -o /tmp/llama.xcframework.zip \
            https://github.com/${{ github.repository }}/releases/download/ci-llama-xcframework/llama.xcframework.zip
          mkdir -p Frameworks
          unzip -q /tmp/llama.xcframework.zip -d Frameworks
          ls Frameworks/llama.xcframework

      - name: Install iOS platform
        run: |
          echo "=== Downloading iOS platform (with retry) ==="
          for i in 1 2 3 4 5; do
            echo "Attempt $i..."
            if xcodebuild -downloadPlatform iOS 2>&1 && xcodebuild -showsdks | grep -q "iphoneos"; then
              echo "iOS platform installed successfully"
              exit 0
            fi
            echo "Attempt $i failed, waiting 30 seconds..."
            sleep 30
          done
          echo "=== Final SDK check ==="
          xcodebuild -showsdks
          xcodebuild -showsdks | grep -q "iphoneos" || { echo "ERROR: iOS SDK not available"; exit 1; }

      - name: Build missing llama Mac Catalyst slice
        run: python3 scripts/build-llama-catalyst.py

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available | grep iPhone | head -10

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ElioChat.xcodeproj \
            -scheme ElioChat

      - name: Build
        run: |
          xcodebuild build \
            -project ElioChat.xcodeproj \
            -scheme ElioChat \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/ios-review \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Audit iOS binary for HealthKit
        run: python3 scripts/audit-review-app.py build/ios-review/Build/Products/Debug-iphoneos/ElioChat.app

      - name: Build Mac Catalyst release
        run: |
          xcodebuild build \
            -project ElioChat.xcodeproj \
            -scheme ElioChat \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            -configuration Release \
            -derivedDataPath build/mac-review \
            CODE_SIGNING_ALLOWED=NO

      - name: Audit and launch Mac Catalyst release
        run: |
          python3 scripts/audit-review-app.py build/mac-review/Build/Products/Release-maccatalyst/ElioChat.app --launch

      - name: Run Tests
        run: |
          # Get first available iPhone simulator
          SIMULATOR=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for runtime,devices in d["devices"].items() if runtime.endswith("iOS-26-2") for v in devices if "iPhone" in v["name"]))')
          echo "Using simulator: $SIMULATOR"
          xcrun simctl bootstatus "$SIMULATOR" -b

          xcodebuild test \
            -project ElioChat.xcodeproj \
            -scheme ElioChat \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult

          # Show test summary
          if [ -d "TestResults.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult
          fi

      - name: Upload review verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-verification
          path: |
            TestResults.xcresult
            build/mac-launch.log
            ~/Library/Logs/DiagnosticReports/ElioChat*
          retention-days: 14

  upload:
    name: Upload verified ${{ matrix.platform }} build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    environment: production
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms == 'mac' && '["mac"]' || inputs.platforms == 'ios' && '["ios"]' || '["ios","mac"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Fetch iOS llama dependency
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/llama.zip" \
            https://github.com/${{ github.repository }}/releases/download/ci-llama-xcframework/llama.xcframework.zip
          unzip -q "$RUNNER_TEMP/llama.zip" -d Frameworks
      - name: Prepare Catalyst-compatible MarkdownView
        run: python3 scripts/prepare-markdown.py
      - name: Build Mac Catalyst dependency
        if: matrix.platform == 'mac'
        run: python3 scripts/build-llama-catalyst.py
      - name: Archive, audit and upload only
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: python3 scripts/upload-review-build.py '${{ matrix.platform }}'
